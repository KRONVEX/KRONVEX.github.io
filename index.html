<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KRONVEX — Cross-Platform Apps, Market Intelligence & Mission-Critical AI</title>
    <meta
      name="description"
      content="Building cross-platform apps, market intelligence, and mission-critical AI to solve complex real-world problems. Download Android & Windows apps, AI skills, and local-first AI models."
    />
    <link rel="canonical" href="https://kronvex.github.io/" />
    <link rel="ard" href="/.well-known/ard.json" type="application/json" />
    <meta property="og:title" content="KRONVEX — Engineering & Applied Intelligence" />
    <meta
      property="og:description"
      content="Cross-platform apps, market intelligence platforms, AI agent skills, and local-first mission-critical AI models."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://kronvex.github.io/kronvex-logo.png" />
    <link rel="icon" type="image/png" href="/kronvex-logo-96.png" />
    <link rel="preload" as="image" href="/kronvex-logo-96.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      // Restore SPA route redirected by GitHub Pages 404.html
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body class="bg-white text-black dark:bg-[#050811] dark:text-white antialiased selection:bg-sky-600 selection:text-white dark:selection:bg-sky-500/40 dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
